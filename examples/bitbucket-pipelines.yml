# Example: register a LynxTrac release from a Bitbucket Pipeline.
#
# The action is installed from git and run as `npx lynxtrac-deploy`. Bitbucket has no `with:`
# inputs, so inputs are supplied as environment variables. Store secrets (APIKEY) as
# Repository variables (Repository settings -> Repository variables) so they are never hardcoded;
# per-release values (BLUEPRINT / VERSION / ARTIFACTS) are set inline before the command.
#
# The set of ARTIFACTS slot keys comes from your blueprint — open it in LynxTrac and use
# Dry run -> Copy YAML (choose "Bitbucket Pipelines") to generate this block with the exact slots.

image: node:22 # requires Node.js 18+

pipelines:
  default:
    - step:
        name: Register LynxTrac release
        script:
          - npm install git+https://github.com/LynxTrac/deploy-action.git
          # optional TRIGGER_ENVIRONMENT come from Repository variables.
          # commit/branch auto-fill from Bitbucket's BITBUCKET_COMMIT / BITBUCKET_BRANCH.
          - >
            APIKEY='1q2w3e4r5t'
            BLUEPRINT='LRB12'
            VERSION='2.5.0'
            ARTIFACTS='{ "app-bundle": "https://your-ci/artifacts/app-2.5.0.zip", "db-migrate": "https://your-ci/artifacts/migrate-2.5.0.sql" }'
            npx lynxtrac-deploy
